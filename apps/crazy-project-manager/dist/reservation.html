<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="studio-reservation" content="museum-night">
  <title>夜游美术馆 · 预约</title>
  <style>
    @font-face {
      font-family: 'SDK US Web';
      src: url('/assets/fonts/en-us.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    :root { color-scheme: dark; font-family: system-ui, 'Microsoft YaHei', sans-serif; color: #e9f6c7; background: #13291e; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(32rem, 100% - 3rem); padding: 3rem 0; }
    h1 { font-family: 'SDK US Web', system-ui, 'Microsoft YaHei', sans-serif; font-weight: 900; font-synthesis-weight: none; font-size: 2.5rem; line-height: 1.05; margin: .4em 0; }
    dl { display: grid; grid-template-columns: 5rem 1fr; gap: .8rem; margin: 2rem 0; }
    dd { margin: 0; }
    p, dt { color: #b4c6a6; }
  </style>
</head>
<body>
  <main>
    <p>未眠美术馆 · 夜间特别开放</p>
    <h1>夜游美术馆</h1>
    <dl>
      <dt>展期</dt><dd>11.21 — 12.21</dd>
      <dt>时段</dt><dd>18:00 — 22:00</dd>
      <dt>入场</dt><dd>免费 · 须预约 · 东门入场</dd>
    </dl>
    <p>预约入口演示</p>
  </main>
</body>
</html>
